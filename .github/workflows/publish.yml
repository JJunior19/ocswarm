name: publish

# Publishes to npm when a GitHub release is published (tag must match
# package.json version), or manually via workflow_dispatch.
#
# Setup (once): add the NPM_TOKEN repository secret
# (Settings → Secrets and variables → Actions; create the token with
# `npm token create` — Automation type, publish permission).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance (public packages)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Guard — release tag must match package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(jq -r .version package.json)"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build dashboard
        run: bun run build:web

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
